<!doctype html><html data-theme="dark" style="color-scheme:dark"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Task Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Layout: sticky quick-add bar over two views. Home = stats, day list, month calendar. Board = four time lanes of ticket cards. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface2:#F5F7FA; --ink:#101A24; --mute:#5A6A79; --line:#D8DFE6;
  --accent:#1B4FD6; --accent-ink:#FFFFFF; --accent-soft:#E3EBFD;
  --hi:#C62F3B; --hi-soft:#FBE7E9; --md:#A86A0B; --md-soft:#FBEFD9; --lo:#2B7A55; --lo-soft:#E0F2E9;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1319; --surface:#151D25; --surface2:#1B252F; --ink:#E6EDF3; --mute:#92A3B3; --line:#27333F;
  --accent:#7BA7FF; --accent-ink:#0D1319; --accent-soft:#1C2B4A;
  --hi:#FF8089; --hi-soft:#3A1F24; --md:#E5B45A; --md-soft:#3A2E16; --lo:#62C792; --lo-soft:#16311F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1319; --surface:#151D25; --surface2:#1B252F; --ink:#E6EDF3; --mute:#92A3B3; --line:#27333F;
  --accent:#7BA7FF; --accent-ink:#0D1319; --accent-soft:#1C2B4A;
  --hi:#FF8089; --hi-soft:#3A1F24; --md:#E5B45A; --md-soft:#3A2E16; --lo:#62C792; --lo-soft:#16311F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.02em;margin-right:auto}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:7px;color:var(--mute);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.add{display:flex;gap:8px;margin-top:10px}
.add input{flex:1;min-width:0;height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:15px}
.add input::placeholder{color:var(--mute)}
.btn{height:44px;padding:0 18px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.sm{height:34px;padding:0 14px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--hi-soft);color:var(--hi)}
.hint{min-height:26px;margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--mute)}
.pill{display:inline-flex;gap:4px;align-items:center;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.pill.hi{background:var(--hi-soft);color:var(--hi);border-color:transparent}
.pill.md{background:var(--md-soft);color:var(--md);border-color:transparent}
.pill.lo{background:var(--lo-soft);color:var(--lo);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.notice{background:var(--md-soft);color:var(--md);padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:13px}
h1{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.02em;margin:10px 0 2px}
.sub{color:var(--mute);margin:0 0 16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .n{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.stat.alert .n{color:var(--hi)}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:760px){.cols{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.panel h2{font-family:var(--f-display);font-size:16px;font-weight:700;margin:0 0 4px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:12px 0 2px}
.row{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.chk{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center;padding:0;color:transparent}
.chk:hover{border-color:var(--accent)}
.chk.done{background:var(--lo);border-color:var(--lo);color:#fff}
.chk svg{width:12px;height:12px}
.ttl{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;display:block}
.ttl b{font-weight:500;display:block;overflow-wrap:anywhere}
.ttl.done b{text-decoration:line-through;color:var(--mute)}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.id{font-family:var(--f-mono);font-size:11px;color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.hi{background:var(--hi)}.dot.md{background:var(--md)}.dot.lo{background:var(--lo)}
.empty{padding:22px 4px;color:var(--mute);text-align:center}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal .wd{font-size:11px;color:var(--mute);padding:2px 0}
.cal button{aspect-ratio:1/1;border:1px solid transparent;border-radius:8px;background:none;padding:0;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px}
.cal button:hover{background:var(--surface2)}
.cal button.today{border-color:var(--accent);color:var(--accent);font-weight:500}
.cal button.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cal button.out{visibility:hidden}
.cal .pips{display:flex;gap:2px;height:5px}
.cal .pips i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.cal .pips i.late{background:var(--hi)}
.cal button.sel .pips i{background:var(--bg)}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:900px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.board{grid-template-columns:minmax(0,1fr)}}
.lane{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:180px}
.lane.over{outline:2px dashed var(--accent);outline-offset:-4px}
.lane h3{margin:0 0 8px;font-size:13px;font-weight:500;display:flex;justify-content:space-between;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.lane.late h3 span:last-child{color:var(--hi)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:grab;display:block;width:100%;text-align:left}
.card.late{border-color:var(--hi)}
.card .t{font-weight:500;overflow-wrap:anywhere;margin:2px 0 6px;display:block}
.card.dragging{opacity:.4}
.drop{border:1px dashed var(--line);border-radius:10px;padding:12px;text-align:center;color:var(--mute);font-size:12px}
details.donebox{margin-top:14px}
details.donebox summary{cursor:pointer;color:var(--mute);margin-bottom:8px}
.veil{position:fixed;inset:0;background:rgba(8,12,16,.55);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;width:100%;max-width:560px;max-height:calc(100dvh - 32px);overflow-y:auto;display:grid;gap:12px}
.modal h2{font-family:var(--f-display);margin:0;font-size:18px}
.modal label{display:grid;gap:4px;font-size:12px;color:var(--mute)}
.modal input,.modal select{height:38px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.acts .left{margin-right:auto}
.detail{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:14px}
.detail h3{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:500}
.srcrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.detail a{color:var(--accent)}
.txt{font-size:13px;overflow-wrap:anywhere}
.chain{list-style:none;margin:0;padding:0}
.chain li{display:grid;grid-template-columns:10px minmax(0,1fr);gap:10px;padding-bottom:12px;position:relative}
.chain li::before{content:'';position:absolute;left:4px;top:14px;bottom:0;width:1px;background:var(--line)}
.chain li:last-child{padding-bottom:0}
.chain li:last-child::before{display:none}
.chain .pt{width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:5px}
.chain .who{font-weight:500;font-size:13px}
.chain .when{font-size:11px;color:var(--mute);font-family:var(--f-mono);margin-left:6px}
.qwrap{position:relative;flex:1;min-width:0;display:flex}
.qwrap input{width:100%;padding-left:40px;padding-right:64px}
.qwrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mute);pointer-events:none}
.qwrap kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-family:var(--f-mono);font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:1px 7px;pointer-events:none}
.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
.wk{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 6px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--ink);min-width:0}
.wk b{font-family:var(--f-display);font-size:20px;font-weight:700;line-height:1.2}
.wk i{display:block;height:6px;border-radius:3px;margin-top:8px;min-width:14px}
.wk.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wk.on i{background:var(--bg)!important}
.b-acc{background:var(--accent)}.b-hi{background:var(--hi)}.b-lo{background:var(--lo)}.b-none{background:var(--line)}
.focus-row{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;margin-bottom:16px}
@media (max-width:760px){.focus-row{grid-template-columns:minmax(0,1fr)}}
.focus .lbl{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.focus .ft{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:-.01em;margin:8px 0 4px;overflow-wrap:anywhere}
.focus .fs{color:var(--mute);margin-bottom:16px}
.focus .fa{display:flex;gap:8px;flex-wrap:wrap}
.un{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;font-size:14px}
.un:first-of-type{border-top:0}
.un span:first-child{overflow-wrap:anywhere}
.un span:last-child{color:var(--mute);white-space:nowrap}
.un .hi{color:var(--hi)}
.mic{flex:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--mute);display:grid;place-items:center;padding:0}
.mic svg{width:19px;height:19px}
.mic:hover{color:var(--ink);border-color:var(--mute)}
.mic[aria-pressed="true"]{background:var(--hi-soft);color:var(--hi);border-color:var(--hi)}
.search{margin-top:10px}
.swrap{position:relative}
.swrap input{width:100%;height:40px;padding:0 14px 0 38px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:14px}
.swrap svg.mag{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--mute);pointer-events:none}
.swrap .mic{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:none;border-radius:8px}
.swrap .mic[aria-pressed="true"]{background:var(--hi-soft)}
.shead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0 10px}
.shead h1{margin:0;font-size:20px}
footer{color:var(--mute);font-size:12px;padding-block:24px 20px}
@media (prefers-reduced-motion:no-preference){.card,.row{transition:opacity .15s}}
</style>

<div class="wrap">
  <div class="top">
    <div class="bar">
      <div class="brand">Task Desk</div>
      <div class="seg" role="group" aria-label="View">
        <button id="v-home" aria-pressed="true">Home</button>
        <button id="v-board" aria-pressed="false">Board</button>
      </div>
    </div>
    <form class="add" id="addForm" autocomplete="off">
      <div class="qwrap"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 3l1.6 4.4L15 9l-4.4 1.6L9 15l-1.6-4.4L3 9l4.4-1.6L9 3zm9 8l1 2.6 2.6 1-2.6 1-1 2.6-1-2.6-2.6-1 2.6-1 1-2.6zM17 2l.8 2.2L20 5l-2.2.8L17 8l-.8-2.2L14 5l2.2-.8L17 2z"/></svg><input id="quick" type="text" placeholder="Call the lab on Tuesday at 10, high priority" aria-label="Add a task"><kbd>Enter</kbd></div>
      <button class="btn" type="submit">Add task</button>
    </form>
    <div class="search"><div class="swrap"><svg class="mag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="search" type="search" placeholder="Search tasks, tags, senders, steps" aria-label="Search tasks" autocomplete="off"></div></div>
    <div class="hint" id="hint" aria-live="polite"></div>
  </div>
  <div id="notice"></div>
  <main id="main"></main>
  <footer>Type a date, time, priority or tag in plain words. Examples: tomorrow, fri, oct 20, in 3 days, at 2pm, high, #home.</footer>
</div>
<div id="modalHost"></div>

<script>
(function(){
  var DAYS=['sun','mon','tue','wed','thu','fri','sat'];
  var MONTHS=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  var MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var state={tasks:[],view:'home',sel:null,cal:null,db:null,col:null,loaded:false,editing:null,confirmDel:false};
  var $=function(id){return document.getElementById(id)};
  function pad(n){return n<10?'0'+n:''+n}
  function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  function fromYmd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
  function addDays(s,n){var d=fromYmd(s);d.setDate(d.getDate()+n);return ymd(d)}
  function diff(a,b){return Math.round((Date.UTC.apply(null,a.split('-').map(function(x,i){return i==1?x-1:+x}))-Date.UTC.apply(null,b.split('-').map(function(x,i){return i==1?x-1:+x})))/864e5)}
  function today(){return ymd(new Date())}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function fmtDate(s){var d=fromYmd(s);var t=today();var n=diff(s,t);
    if(n===0)return 'Today';if(n===1)return 'Tomorrow';if(n===-1)return 'Yesterday';
    return DAYS[d.getDay()].replace(/^./,function(c){return c.toUpperCase()})+' '+MONTHS[d.getMonth()].replace(/^./,function(c){return c.toUpperCase()})+' '+d.getDate()}
  function fmtTime(t){if(!t)return '';var p=t.split(':');var h=+p[0];var ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+p[1]+' '+ap}
  function tid(n){return 'TSK-'+('000'+n).slice(-3)}

  function parseQuick(raw){
    var s=' '+raw+' ',out={due:null,time:'',priority:'med',tag:'',title:''},m;
    m=s.match(/\s#([\w-]+)/);if(m){out.tag=m[1];s=s.replace(m[0],' ')}
    m=s.match(/\s(!!|!high|urgent|asap|high(?:\s+priority)?)(?=\s|$)/i);if(m){out.priority='high';s=s.replace(m[0],' ')}
    else{m=s.match(/\s(low(?:\s+priority)?|someday)(?=\s|$)/i);if(m){out.priority='low';s=s.replace(m[0],' ')}}
    m=s.match(/\s(?:at\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)(?=\s|$|[.,])/i)||s.match(/\sat\s+(\d{1,2})(?::(\d{2}))?(?=\s|$|[.,])/i);
    if(m){var h=+m[1],mi=m[2]?+m[2]:0,ap=(m[3]||'').toLowerCase();
      if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0;
      if(!ap&&h<7)h+=12;
      if(h<24&&mi<60){out.time=pad(h)+':'+pad(mi);s=s.replace(m[0],' ')}}
    var t=today();
    if(m=s.match(/\s(?:on\s+|by\s+|due\s+)?(today|tonight)(?=\s|$|[.,])/i)){out.due=t;s=s.replace(m[0],' ')}
    else if(m=s.match(/\s(?:on\s+|by\s+|due\s+)?(tomorrow|tmrw|tmr)(?=\s|$|[.,])/i)){out.due=addDays(t,1);s=s.replace(m[0],' ')}
    else if(m=s.match(/\s(?:in\s+)(\d{1,3})\s+(day|days|week|weeks)(?=\s|$|[.,])/i)){out.due=addDays(t,(+m[1])*(/week/i.test(m[2])?7:1));s=s.replace(m[0],' ')}
    else if(m=s.match(/\s(?:next\s+week)(?=\s|$|[.,])/i)){out.due=addDays(t,7);s=s.replace(m[0],' ')}
    else if(m=s.match(/\s(?:on\s+|by\s+|due\s+|next\s+)?(sun|mon|tue|tues|wed|thu|thur|thurs|fri|sat)[a-z]*(?=\s|$|[.,])/i)){
      var wd=DAYS.indexOf(m[1].toLowerCase().slice(0,3));var cur=new Date().getDay();var add=(wd-cur+7)%7;if(add===0)add=7;
      out.due=addDays(t,add);s=s.replace(m[0],' ')}
    else if(m=s.match(/\s(?:on\s+|by\s+|due\s+)?(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?=\s|$|[.,])/i)){
      var mo=MONTHS.indexOf(m[1].toLowerCase().slice(0,3)),dy=+m[2];var now=new Date();var yr=now.getFullYear();
      var cand=new Date(yr,mo,dy);if(ymd(cand)<t)cand=new Date(yr+1,mo,dy);
      if(dy>=1&&dy<=31){out.due=ymd(cand);s=s.replace(m[0],' ')}}
    else if(m=s.match(/\s(?:on\s+|by\s+|due\s+)?(\d{1,2})\/(\d{1,2})(?=\s|$|[.,])/)){
      var mo2=+m[1]-1,dy2=+m[2];var y2=new Date().getFullYear();var c2=new Date(y2,mo2,dy2);
      if(mo2>=0&&mo2<12&&dy2>=1&&dy2<=31){if(ymd(c2)<t)c2=new Date(y2+1,mo2,dy2);out.due=ymd(c2);s=s.replace(m[0],' ')}}
    out.title=s.replace(/\s+/g,' ').replace(/^[\s,.\-–]+|[\s,.\-–]+$/g,'').replace(/\s+(on|by|at|due|for)$/i,'').trim();
    out.dateGiven=!!out.due;if(!out.due)out.due=t;
    return out;
  }

  function mkTask(p){return {title:p.title,due:p.due,time:p.time||'',priority:p.priority||'med',tag:p.tag||'',status:'open'}}

  function nextNum(){var mx=0;state.tasks.forEach(function(t){if(t.num>mx)mx=t.num});return mx+1}
  function save(t){
    if(!state.col){var i=state.tasks.findIndex(function(x){return x.id===t.id});if(i<0)state.tasks.push(t);else state.tasks[i]=t;render();return Promise.resolve()}
    var body=Object.assign({},t);delete body.id;
    return state.col.doc(t.id).set(body).catch(function(e){showNotice('Couldn’t save that change. Try again.')})
  }
  function remove(id){
    if(!state.col){state.tasks=state.tasks.filter(function(t){return t.id!==id});render();return Promise.resolve()}
    return state.col.doc(id).delete().catch(function(){showNotice('Couldn’t delete that task. Try again.')})
  }
  function showNotice(msg){$('notice').innerHTML=msg?'<div class="notice" role="status">'+esc(msg)+'</div>':''}

  function addFromQuick(){
    var v=$('quick').value;var p=parseQuick(v);
    if(!p.title){$('hint').innerHTML='<span style="color:var(--hi)">Add a task name first.</span>';return}
    var t=mkTask(p);t.id='t'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);t.num=nextNum();t.createdAt=Date.now();
    $('quick').value='';updateHint();
    state.sel=t.due;
    save(t);
  }
  function updateHint(){
    var v=$('quick').value.trim();if(!v){$('hint').innerHTML='';return}
    var p=parseQuick(v);var h='';
    h+='<span class="pill acc">'+esc(fmtDate(p.due))+(p.dateGiven?'':' (default)')+'</span>';
    if(p.time)h+='<span class="pill">'+esc(fmtTime(p.time))+'</span>';
    h+='<span class="pill '+(p.priority==='high'?'hi':p.priority==='low'?'lo':'md')+'">'+(p.priority==='high'?'High':p.priority==='low'?'Low':'Normal')+'</span>';
    if(p.tag)h+='<span class="pill">#'+esc(p.tag)+'</span>';
    $('hint').innerHTML=h;
  }

  function toggle(id){
    var t=state.tasks.find(function(x){return x.id===id});if(!t)return;
    var done=t.status!=='done';
    var nt=Object.assign({},t,{status:done?'done':'open',doneAt:done?Date.now():0});
    save(nt);
  }

  function lane(t){var n=diff(t.due,today());return n<0?'overdue':n===0?'today':n<=7?'next':'later'}
  function sortTasks(a,b){return (a.due+(a.time||'99:99')).localeCompare(b.due+(b.time||'99:99'))||a.num-b.num}
  var CHECK='<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.5l2.6 2.6L10 3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function rowHtml(t,showDate){
    var late=t.status!=='done'&&t.due<today();
    var meta='<span class="id">'+tid(t.num)+'</span>';
    if(showDate)meta+='<span class="pill'+(late?' hi':'')+'">'+esc(fmtDate(t.due))+'</span>';
    if(t.time)meta+='<span class="pill">'+esc(fmtTime(t.time))+'</span>';
    if(t.tag)meta+='<span class="pill">#'+esc(t.tag)+'</span>';
    if(t.source)meta+='<span class="pill acc">'+esc(t.source.type)+'</span>';
    return '<div class="row"><button class="chk'+(t.status==='done'?' done':'')+'" data-act="toggle" data-id="'+esc(t.id)+'" aria-label="'+(t.status==='done'?'Mark not done':'Mark done')+': '+esc(t.title)+'">'+CHECK+'</button>'+
      '<span class="dot '+t.priority+'" title="'+t.priority+' priority"></span>'+
      '<button class="ttl'+(t.status==='done'?' done':'')+'" data-act="edit" data-id="'+esc(t.id)+'"><b>'+esc(t.title)+'</b><span class="meta">'+meta+'</span></button></div>';
  }

  function renderHome(){
    var t0=today();var open=state.tasks.filter(function(t){return t.status!=='done'});
    var dueToday=open.filter(function(t){return t.due===t0}).length;
    var overdue=open.filter(function(t){return t.due<t0}).length;
    var week=open.filter(function(t){var n=diff(t.due,t0);return n>=0&&n<=7}).length;
    var weekAgo=Date.now()-7*864e5;
    var doneWeek=state.tasks.filter(function(t){return t.status==='done'&&t.doneAt>weekAgo}).length;
    var hr=new Date().getHours();var g=hr<12?'Good morning':hr<18?'Good afternoon':'Good evening';
    var sel=state.sel||t0;
    var dayTasks=state.tasks.filter(function(t){return t.due===sel}).sort(sortTasks);
    var dayOpen=dayTasks.filter(function(t){return t.status!=='done'}),dayDone=dayTasks.filter(function(t){return t.status==='done'});
    var late=sel===t0?open.filter(function(t){return t.due<t0}).sort(sortTasks):[];
    var h='<h1>'+g+', Anmol</h1><p class="sub">'+esc(new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}))+'</p>';
    var sorted=open.slice().sort(sortTasks);
    var focus=sorted.find(function(t){return t.due<=t0})||sorted[0];
    var upnext=sorted.filter(function(t){return focus&&t.id!==focus.id}).slice(0,3);
    function dayShort(s){var n=DAYS[fromYmd(s).getDay()];return n.charAt(0).toUpperCase()+n.slice(1)}
    function focusSub(t){var n=diff(t.due,t0);var tm=t.time?' at '+fmtTime(t.time):'';
      if(n<0)return 'Overdue by '+(-n)+(n===-1?' day':' days')+', was due '+fmtDate(t.due)+tm;
      if(n===0)return 'Due today'+tm;return 'Due '+fmtDate(t.due)+tm}
    function unLabel(t){var n=diff(t.due,t0);var tm=t.time?fmtTime(t.time):'';
      if(n<0)return 'Overdue';if(n===0)return tm||'Today';if(n<=6)return dayShort(t.due)+(tm?' '+tm:'');return fmtDate(t.due)}
    var days=[t0],cursor=t0;
    while(days.length<5){cursor=addDays(cursor,1);var wd=fromYmd(cursor).getDay();if(wd!==0&&wd!==6)days.push(cursor)}
    h+='<div class="week" role="group" aria-label="Next five working days">'+days.map(function(d){
      var list=open.filter(function(t){return d===t0?t.due<=t0:t.due===d});
      var cls=!list.length?'b-none':list.some(function(t){return t.priority==='high'||t.due<t0})?'b-hi':list.every(function(t){return t.priority==='low'})?'b-lo':'b-acc';
      var w=list.length?Math.min(100,30+list.length*14):30;
      return '<button class="wk'+(d===sel?' on':'')+'" data-act="pick" data-date="'+d+'" aria-label="'+dayShort(d)+' '+fromYmd(d).getDate()+', '+list.length+' open"><span>'+dayShort(d)+'</span><b>'+fromYmd(d).getDate()+'</b><i class="'+cls+'" style="width:'+w+'%"></i></button>'}).join('')+'</div>';
    h+='<div class="focus-row"><section class="panel focus" aria-label="Focus now"><div class="lbl">Focus now</div>';
    if(focus){h+='<div class="ft">'+esc(focus.title)+'</div><div class="fs">'+esc(focusSub(focus))+'</div><div class="fa"><button class="btn sm" data-act="focusdone" data-id="'+esc(focus.id)+'">Mark done</button><button class="btn sm ghost" data-act="snooze" data-id="'+esc(focus.id)+'">Snooze a day</button><button class="btn sm ghost" data-act="edit" data-id="'+esc(focus.id)+'">Details</button></div>'}
    else{h+='<div class="ft">'+(state.loaded?'You’re all clear':'Loading…')+'</div><div class="fs">'+(state.loaded?'Nothing open right now. Add a task above.':'')+'</div>'}
    h+='</section><section class="panel" aria-label="Up next"><h2>Up next</h2>'+(upnext.length?upnext.map(function(t){return '<button class="un" data-act="edit" data-id="'+esc(t.id)+'"><span>'+esc(t.title)+'</span><span class="'+(t.priority==='high'?'hi':'')+'">'+esc(unLabel(t))+'</span></button>'}).join(''):'<div class="empty">Nothing else queued.</div>')+'</section></div>';
    h+='<div class="stats"><div class="stat"><div class="n">'+dueToday+'</div><div class="l">Due today</div></div>'+
      '<div class="stat'+(overdue?' alert':'')+'"><div class="n">'+overdue+'</div><div class="l">Overdue</div></div>'+
      '<div class="stat"><div class="n">'+week+'</div><div class="l">Next 7 days</div></div>'+
      '<div class="stat"><div class="n">'+doneWeek+'</div><div class="l">Done this week</div></div></div>';
    h+='<div class="cols"><section class="panel"><h2><span>'+(sel===t0?'Today':esc(fmtDate(sel)))+'</span>'+(sel!==t0?'<button class="btn ghost sm" data-act="gotoday">Back to today</button>':'')+'</h2>';
    if(late.length){h+='<div class="sec">Overdue</div>'+late.map(function(t){return rowHtml(t,true)}).join('')}
    if(late.length&&(dayOpen.length||dayDone.length))h+='<div class="sec">Due today</div>';
    if(dayOpen.length)h+=dayOpen.map(function(t){return rowHtml(t,false)}).join('');
    if(dayDone.length){h+='<div class="sec">Done</div>'+dayDone.map(function(t){return rowHtml(t,false)}).join('')}
    if(!late.length&&!dayOpen.length&&!dayDone.length)h+='<div class="empty">'+(state.loaded?'Nothing scheduled. Add a task above and it lands here.':'Loading your tasks…')+'</div>';
    h+='</section><section class="panel" aria-label="Calendar">'+calHtml()+'</section></div>';
    return h;
  }

  function calHtml(){
    var c=state.cal||(state.cal=ymd(new Date()).slice(0,8)+'01');var d=fromYmd(c);
    var y=d.getFullYear(),m=d.getMonth();var first=new Date(y,m,1).getDay();var dim=new Date(y,m+1,0).getDate();
    var t0=today();var sel=state.sel||t0;
    var h='<div class="cal-h"><button data-act="prev" aria-label="Previous month">&lsaquo;</button><b style="font-family:var(--f-display)">'+MN[m]+' '+y+'</b><button data-act="next" aria-label="Next month">&rsaquo;</button></div><div class="cal">';
    ['S','M','T','W','T','F','S'].forEach(function(w){h+='<div class="wd">'+w+'</div>'});
    for(var i=0;i<first;i++)h+='<button class="out" tabindex="-1" aria-hidden="true"></button>';
    for(var day=1;day<=dim;day++){
      var s=y+'-'+pad(m+1)+'-'+pad(day);
      var ts=state.tasks.filter(function(t){return t.due===s&&t.status!=='done'});
      var pips='';ts.slice(0,3).forEach(function(t){pips+='<i class="'+(s<t0?'late':'')+'"></i>'});
      h+='<button data-act="pick" data-date="'+s+'" class="'+(s===t0?'today ':'')+(s===sel?'sel':'')+'" aria-label="'+s+(ts.length?', '+ts.length+' open':'')+'">'+day+'<span class="pips">'+pips+'</span></button>';
    }
    return h+'</div>';
  }

  function cardHtml(t){
    var late=t.status!=='done'&&t.due<today();
    var meta='<span class="pill'+(late?' hi':'')+'">'+esc(fmtDate(t.due))+'</span>';
    if(t.time)meta+='<span class="pill">'+esc(fmtTime(t.time))+'</span>';
    if(t.tag)meta+='<span class="pill">#'+esc(t.tag)+'</span>';
    if(t.source)meta+='<span class="pill acc">'+esc(t.source.type)+'</span>';
    return '<button class="card'+(late?' late':'')+'" draggable="true" data-act="edit" data-id="'+esc(t.id)+'"><span style="display:flex;gap:6px;align-items:center"><span class="dot '+t.priority+'"></span><span class="id">'+tid(t.num)+'</span></span><span class="t">'+esc(t.title)+'</span><span class="meta">'+meta+'</span></button>';
  }

  function renderBoard(){
    var open=state.tasks.filter(function(t){return t.status!=='done'}).sort(sortTasks);
    var lanes=[['overdue','Overdue',true],['today','Today',false],['next','Next 7 days',false],['later','Later',false]];
    var h='<h1>Board</h1><p class="sub">Drag a card between lanes to reschedule it. Next 7 days moves it to tomorrow, Later moves it two weeks out.</p><div class="board">';
    lanes.forEach(function(l){
      var items=open.filter(function(t){return lane(t)===l[0]});
      h+='<section class="lane'+(l[0]==='overdue'?' late':'')+'" data-lane="'+l[0]+'"><h3><span>'+l[1]+'</span><span>'+items.length+'</span></h3>'+
        items.map(cardHtml).join('')+(l[0]==='overdue'?(items.length?'':'<div class="drop">Nothing late</div>'):'<div class="drop">Drop here</div>')+'</section>';
    });
    h+='</div>';
    var done=state.tasks.filter(function(t){return t.status==='done'}).sort(function(a,b){return (b.doneAt||0)-(a.doneAt||0)});
    if(done.length)h+='<details class="donebox"><summary>Done ('+done.length+')</summary><section class="panel">'+done.map(function(t){return rowHtml(t,true)}).join('')+'</section></details>';
    return h;
  }

  function hay(t){
    var s=[t.title,t.tag,t.why,t.priority,t.due,t.source&&t.source.type,t.source&&t.source.label,tid(t.num)];
    (Array.isArray(t.chain)?t.chain:[]).forEach(function(c){s.push(c.who,c.text)});
    return s.filter(Boolean).join(' ').toLowerCase()}
  function renderSearch(){
    var words=state.q.toLowerCase().split(/\s+/).filter(Boolean);
    var hits=state.tasks.filter(function(t){var h=hay(t);return words.every(function(w){return h.indexOf(w)>-1})}).sort(function(a,b){return (a.status==='done')-(b.status==='done')||sortTasks(a,b)});
    var h='<div class="shead"><h1>'+hits.length+(hits.length===1?' result':' results')+' for “'+esc(state.q)+'”</h1><button class="btn sm ghost" data-act="clearsearch">Clear search</button></div><section class="panel">';
    h+=hits.length?hits.map(function(t){return rowHtml(t,true)}).join(''):'<div class="empty">No tasks match. Try a Customer 163 name, a tag like #banking, or a ticket ID.</div>';
    return h+'</section>';
  }
  function render(){
    $('v-home').setAttribute('aria-pressed',state.view==='home');$('v-board').setAttribute('aria-pressed',state.view==='board');
    var y=window.scrollY;
    $('main').innerHTML=state.q?renderSearch():(state.view==='home'?renderHome():renderBoard());
    window.scrollTo(0,y);
    renderModal();
  }

  function renderModal(){
    var host=$('modalHost');
    if(!state.editing){host.innerHTML='';return}
    var t=state.tasks.find(function(x){return x.id===state.editing});if(!t){state.editing=null;host.innerHTML='';return}
    if(host.firstChild&&host.dataset.id===t.id)return;
    host.dataset.id=t.id;
    host.innerHTML='<div class="veil" data-act="veil"><form class="modal" id="editForm" role="dialog" aria-modal="true" aria-label="Edit task"><h2>'+tid(t.num)+'</h2>'+
      '<label>Task<input id="e-title" value="'+esc(t.title)+'" required></label>'+
      '<div class="two"><label>Due date<input id="e-due" type="date" value="'+esc(t.due)+'" required></label><label>Time<input id="e-time" type="time" value="'+esc(t.time||'')+'"></label></div>'+
      '<div class="two"><label>Priority<select id="e-pri"><option value="high"'+(t.priority==='high'?' selected':'')+'>High</option><option value="med"'+(t.priority==='med'?' selected':'')+'>Normal</option><option value="low"'+(t.priority==='low'?' selected':'')+'>Low</option></select></label>'+
      '<label>Tag<input id="e-tag" value="'+esc(t.tag||'')+'" placeholder="work"></label></div>'+
      detailHtml(t)+'<div class="acts"><span class="left">'+(state.confirmDel?'<button type="button" class="btn sm danger" data-act="delyes">Delete for good</button>':'<button type="button" class="btn sm ghost" data-act="delask">Delete</button>')+'</span><button type="button" class="btn sm ghost" data-act="close">Cancel</button><button type="submit" class="btn sm">Save</button></div></form></div>';
    var el=$('e-title');if(el)el.focus();
  }
  function safeUrl(u){return typeof u==='string'&&/^https:\/\//.test(u)}
  function detailHtml(t){
    var chain=Array.isArray(t.chain)?t.chain:[];var links=Array.isArray(t.links)?t.links:[];
    if(!t.source&&!t.why&&!chain.length&&!links.length)return '';
    var h='<div class="detail">';
    if(t.source){
      h+='<div><h3>Source</h3><div class="srcrow"><span class="pill acc">'+esc(t.source.type)+'</span><span class="txt">'+esc(t.source.label)+'</span>'+
        (safeUrl(t.source.url)?'<a href="'+esc(t.source.url)+'" target="_blank" rel="noopener noreferrer">Open original</a>':'')+'</div>';
      if(links.length){h+='<div class="srcrow" style="margin-top:6px">'+links.filter(function(l){return safeUrl(l.url)}).map(function(l){return '<a href="'+esc(l.url)+'" target="_blank" rel="noopener noreferrer">'+esc(l.label)+'</a>'}).join('')+'</div>'}
      h+='</div>';
    }
    if(t.why)h+='<div><h3>Why this is a task</h3><div class="txt">'+esc(t.why)+'</div></div>';
    if(chain.length){
      h+='<div><h3>Chain ('+chain.length+')</h3><ol class="chain">'+chain.map(function(c){
        return '<li><span class="pt"></span><div><div><span class="who">'+esc(c.who||'')+'</span><span class="when">'+esc(c.when||'')+'</span></div><div class="txt">'+esc(c.text||'')+'</div></div></li>'}).join('')+'</ol></div>';
    }
    return h+'</div>';
  }
  function closeModal(){state.editing=null;state.confirmDel=false;$('modalHost').innerHTML='';delete $('modalHost').dataset.id}

  document.addEventListener('click',function(e){
    var b=e.target.closest('[data-act]');if(!b)return;var a=b.dataset.act;
    if(a==='veil'){if(e.target===b)closeModal();return}
    if(a==='toggle'){e.stopPropagation();toggle(b.dataset.id)}
    else if(a==='edit'){state.editing=b.dataset.id;state.confirmDel=false;$('modalHost').innerHTML='';renderModal()}
    else if(a==='close')closeModal();
    else if(a==='delask'){state.confirmDel=true;$('modalHost').innerHTML='';renderModal()}
    else if(a==='delyes'){var id=state.editing;closeModal();remove(id)}
    else if(a==='pick'){state.sel=b.dataset.date;render()}
    else if(a==='gotoday'){state.sel=today();state.cal=today().slice(0,8)+'01';render()}
    else if(a==='clearsearch'){state.q='';$('search').value='';render()}
    else if(a==='focusdone'){toggle(b.dataset.id)}
    else if(a==='snooze'){var st=state.tasks.find(function(x){return x.id===b.dataset.id});if(st){var base=st.due>today()?st.due:today();save(Object.assign({},st,{due:addDays(base,1)}))}}
    else if(a==='prev'||a==='next'){var d=fromYmd(state.cal);d.setMonth(d.getMonth()+(a==='next'?1:-1));state.cal=ymd(d);render()}
  });
  document.addEventListener('submit',function(e){
    if(e.target.id==='addForm'){e.preventDefault();addFromQuick()}
    else if(e.target.id==='editForm'){e.preventDefault();
      var t=state.tasks.find(function(x){return x.id===state.editing});if(!t)return;
      var title=$('e-title').value.trim();if(!title)return;
      var nt=Object.assign({},t,{title:title,due:$('e-due').value||t.due,time:$('e-time').value||'',priority:$('e-pri').value,tag:$('e-tag').value.trim().replace(/^#/,'')});
      closeModal();save(nt)}
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&state.editing)closeModal()});
  $('quick').addEventListener('input',updateHint);
  state.q='';
  $('search').addEventListener('input',function(){state.q=$('search').value.trim();render()});
  $('search').addEventListener('keydown',function(e){if(e.key==='Escape'){$('search').value='';state.q='';render()}});
  $('v-home').onclick=function(){state.view='home';render()};
  $('v-board').onclick=function(){state.view='board';render()};

  var dragId=null;
  document.addEventListener('dragstart',function(e){var c=e.target.closest&&e.target.closest('.card');if(!c)return;dragId=c.dataset.id;c.classList.add('dragging');try{e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move'}catch(_){}});
  document.addEventListener('dragend',function(e){dragId=null;document.querySelectorAll('.dragging,.over').forEach(function(n){n.classList.remove('dragging','over')})});
  document.addEventListener('dragover',function(e){var l=e.target.closest&&e.target.closest('.lane');if(!l||!dragId||l.dataset.lane==='overdue')return;e.preventDefault();document.querySelectorAll('.over').forEach(function(n){n.classList.remove('over')});l.classList.add('over')});
  document.addEventListener('drop',function(e){var l=e.target.closest&&e.target.closest('.lane');if(!l||!dragId)return;e.preventDefault();
    var k=l.dataset.lane;if(k==='overdue')return;var t=state.tasks.find(function(x){return x.id===dragId});if(!t)return;
    var due=k==='today'?today():k==='next'?addDays(today(),1):addDays(today(),14);
    if(lane(t)===k)return;save(Object.assign({},t,{due:due}))});

  function start(){
    render();
    var cl=window.claude;
    if(!cl||!cl.use){state.loaded=true;showNotice('Tasks aren’t being saved in this view. Open the page from your artifact link to keep them.');render();return}
    cl.use('db').then(function(db){
      if(!db){state.loaded=true;showNotice('Tasks aren’t being saved in this view. Open the page from your artifact link to keep them.');render();return}
      state.col=db.collection('tasks');
      state.col.onSnapshot(function(snap){
        state.tasks=snap.docs.map(function(d){var x=Object.assign({},d.data());x.id=d.id;if(typeof x.num!=='number')x.num=0;return x});
        state.loaded=true;
        var ae=document.activeElement;
        if(state.editing&&ae&&ae.closest&&ae.closest('#editForm')){return}
        render();
      },function(){state.loaded=true;showNotice('Lost the connection to your saved tasks. Reload the page to retry.');render()});
    }).catch(function(){state.loaded=true;render()});
  }
  start();
})();
</script>

</body></html>
